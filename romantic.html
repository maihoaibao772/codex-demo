<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>杜忠晴 — 有我爱你</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, rgba(255, 182, 193, 0.9), rgba(221, 160, 221, 0.85));
            --text-color: #fff1f9;
            --heart-color: #ff4d6d;
            --secondary-heart: #ff85a1;
            --shadow-color: rgba(255, 240, 245, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Lucida Calligraphy", "KaiTi", "STKaiti", "Dancing Script", "Palatino", "Times New Roman", serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .glow-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255, 192, 203, 0.5), transparent 60%),
                        radial-gradient(circle at 70% 30%, rgba(255, 228, 225, 0.4), transparent 60%),
                        radial-gradient(circle at 50% 80%, rgba(221, 160, 221, 0.45), transparent 60%);
            filter: blur(2px);
            opacity: 0.9;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            padding: 2rem;
            backdrop-filter: blur(4px);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            box-shadow: 0 0 35px rgba(255, 192, 203, 0.35), 0 0 65px rgba(221, 160, 221, 0.35);
            animation: float 8s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            letter-spacing: 0.12em;
            text-shadow: 0 0 25px var(--shadow-color), 0 0 15px rgba(221, 160, 221, 0.6);
            margin-bottom: 1rem;
        }

        p {
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: 400;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
            margin-bottom: 2rem;
        }

        .heart {
            width: clamp(80px, 18vw, 160px);
            height: clamp(70px, 16vw, 140px);
            position: relative;
            margin: 0 auto;
            transform: rotate(-45deg);
            animation: heartbeat 1.6s ease-in-out infinite;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #ffd1dc 0%, var(--heart-color) 60%);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
        }

        .heart::before {
            top: -50%;
            left: 0;
        }

        .heart::after {
            left: 50%;
            top: 0;
        }

        .hearts-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .floating-heart {
            position: absolute;
            width: 18px;
            height: 16px;
            background: radial-gradient(circle at 30% 30%, #ffe6ee 0%, var(--secondary-heart) 70%);
            transform: rotate(-45deg) scale(var(--scale));
            animation: floatUp var(--duration) linear infinite;
            opacity: 0.8;
        }

        .floating-heart::before,
        .floating-heart::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: 50%;
        }

        .floating-heart::before {
            top: -50%;
            left: 0;
        }

        .floating-heart::after {
            top: 0;
            left: 50%;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }
            25% {
                transform: rotate(-45deg) scale(1.08);
            }
            40% {
                transform: rotate(-45deg) scale(0.98);
            }
            60% {
                transform: rotate(-45deg) scale(1.12);
            }
            80% {
                transform: rotate(-45deg) scale(0.95);
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(-45deg) scale(var(--scale));
                opacity: 0;
            }
            15% {
                opacity: 0.7;
            }
            85% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-10vh) rotate(-45deg) scale(calc(var(--scale) * 1.4));
                opacity: 0;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        @media (max-width: 600px) {
            .content {
                padding: 1.5rem;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="glow-overlay"></div>
    <div class="hearts-container" aria-hidden="true"></div>
    <main class="content">
        <h1>杜忠晴</h1>
        <p>有我爱你</p>
        <div class="heart" aria-hidden="true"></div>
    </main>

    <script>
        const heartsContainer = document.querySelector('.hearts-container');
        const heartCount = window.innerWidth < 768 ? 20 : 40;

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            const duration = (Math.random() * 10 + 8).toFixed(2) + 's';
            const delay = (Math.random() * 5).toFixed(2) + 's';
            heart.style.setProperty('--duration', duration);
            heart.style.animationDelay = delay;
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.setProperty('--scale', (Math.random() * 0.8 + 0.4).toFixed(2));
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
                createHeart();
            }, parseFloat(duration) * 1000 + parseFloat(delay) * 1000);
        }

        for (let i = 0; i < heartCount; i++) {
            setTimeout(createHeart, i * 300);
        }
    </script>
</body>
</html>
